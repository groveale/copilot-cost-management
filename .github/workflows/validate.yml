name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            demo/package-lock.json
            api/package-lock.json
      - run: npm ci --prefix demo && npm ci --prefix api
      - run: npm test --prefix demo && npm test --prefix api
      - run: npm run build --prefix demo && npm run check --prefix api && npm run build --prefix api
      - run: node scripts/check-public.mjs && node --test scripts/deployment.test.mjs
      - name: Compile Bicep
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/access.bicep --stdout > /dev/null
          az bicep build --file infra/bootstrap.bicep --stdout > /dev/null
          az bicep build --file infra/environment.bicep --stdout > /dev/null
