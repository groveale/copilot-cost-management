name: Deploy application
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['demo/**', 'api/**', 'scripts/**', '.github/workflows/deploy.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: copilot-demo-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            demo/package-lock.json
            api/package-lock.json
      - run: npm ci --prefix demo && npm ci --prefix api
      - run: npm test --prefix demo && npm test --prefix api
      - run: npm run build --prefix demo && npm run check --prefix api && npm run build --prefix api
      - name: Configure public bootstrap (repository variables, not private metadata)
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SPA_CLIENT_ID: ${{ vars.SPA_CLIENT_ID }}
          API_CLIENT_ID: ${{ vars.API_CLIENT_ID }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: node scripts/configure-public.mjs
      - run: node scripts/check-public.mjs && node --test scripts/deployment.test.mjs
      - name: Package runtime dependencies without seed tooling
        run: |
          npm prune --prefix api --omit=dev
          rm api/dist/seed.js
          mkdir -p release
          cp -r api/dist api/node_modules api/package.json api/host.json release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-release
          path: |
            demo/dist/
            release/
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-release
      - uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_APP_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_NAME }}
          package: release
          sku: flexconsumption
          remote-build: false
      - uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: demo/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
      - name: Non-mutating HTTPS and authentication smoke checks
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for delay in 5 10 20 30 60; do
            if curl --fail --silent --show-error "$API_BASE_URL/api/health"; then break; fi
            sleep "$delay"
          done
          curl --fail --silent --show-error "$API_BASE_URL/api/health"
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$API_BASE_URL/api/v1/context?code=not-a-credential")
          test "$code" = 401
          curl --fail --silent --show-error "$SITE_URL/auth.html" --output /dev/null
          curl --fail --silent --show-error "$SITE_URL/demo-config.json" --output /dev/null
          echo "Released $GITHUB_SHA. API: $API_BASE_URL Frontend: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
