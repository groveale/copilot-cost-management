<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot Budget Portal | Live budget details</title>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        let saved;
        try { saved = window.localStorage.getItem("copilotAppearance"); }
        catch { /* The settings panel reports unavailable browser storage. */ }
        const preference = param === "light" || param === "dark" ? param : saved;
        const theme = preference === "light" || preference === "dark" ? preference :
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
