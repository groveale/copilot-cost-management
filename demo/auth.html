<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot Budget Portal | Authentication</title>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="auth-message">
      <h1>Completing sign-in</h1>
      <p id="auth-status" role="status">This window will close when authentication completes.</p>
    </main>
    <script type="module" src="/src/auth-bridge.ts"></script>
  </body>
</html>
